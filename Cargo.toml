[package]
name = "cargo-16693-bench"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false
description = "Dep-info collection benchmarks for rust-lang/cargo#16693"

[workspace]

[dependencies]
anyhow = "=1.0.102"
criterion = "=0.8.2"
hex = "=0.4.3"
indexmap = "=2.13.0"
rustc-hash = "=2.1.2"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
thiserror = "=2.0.18"

[profile.release]
opt-level = 3
debug = false
